name: Deploy site (GitHub Pages)

# Publica no GitHub Pages: site de apresentação (apps/marketing) em /<repo>/ e o painel
# (apps/web) em modo demonstração em /<repo>/app/. O painel real precisa de API + PostgreSQL
# + Redis; a demo responde no navegador com dados fictícios.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile --filter @prospex/marketing... --filter @prospex/web...
      - name: Build site de apresentação (/<repo>/)
        run: pnpm --filter @prospex/marketing build
        env:
          STATIC_EXPORT: "true"
          BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          # URL absoluta: o <Link> do Next prefixaria o basePath num caminho relativo.
          NEXT_PUBLIC_SIGNUP_URL: ${{ steps.pages.outputs.base_url }}/app/
      # Painel em modo demonstração: dados fictícios, sem API/banco (lib/demo.ts).
      - name: Build demo do painel (/<repo>/app/)
        run: |
          pnpm --filter @prospex/web build
          node apps/web/scripts/flatten-rsc.mjs apps/web/out
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/app
      - run: |
          cp -r apps/web/out apps/marketing/out/app
          touch apps/marketing/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/marketing/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
