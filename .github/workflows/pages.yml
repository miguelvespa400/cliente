name: Deploy site (GitHub Pages)

# Publica o site de apresentação (apps/marketing) como site estático no GitHub Pages.
# O dashboard (apps/web) precisa de API + PostgreSQL + Redis e não roda no Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @prospex/marketing...
      - name: Build static site
        run: pnpm --filter @prospex/marketing build
        env:
          STATIC_EXPORT: "true"
          BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          NEXT_PUBLIC_SIGNUP_URL: ${{ github.server_url }}/${{ github.repository }}#readme
      - run: touch apps/marketing/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/marketing/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
