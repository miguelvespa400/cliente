name: Deploy site (GitHub Pages)

# Publica no GitHub Pages o site de apresentação (apps/marketing). Os botões "Começar"
# levam ao sistema em produção, no Cloudflare Workers (apps/worker), com dados reais.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PRODUCTION_URL: https://prospex.contato2021.workers.dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile --filter @prospex/marketing...
      - name: Build site de apresentação (/<repo>/)
        run: pnpm --filter @prospex/marketing build
        env:
          STATIC_EXPORT: "true"
          BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          # URL absoluta: o <Link> do Next prefixaria o basePath num caminho relativo.
          NEXT_PUBLIC_SIGNUP_URL: ${{ env.PRODUCTION_URL }}/login/
      # O endereço antigo da demonstração (/<repo>/app/) passa a levar ao sistema real.
      - run: |
          touch apps/marketing/out/.nojekyll
          mkdir -p apps/marketing/out/app
          cat > apps/marketing/out/app/index.html <<EOF
          <!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=${PRODUCTION_URL}/login/">
          <title>Prospex</title></head>
          <body><p>Redirecionando para <a href="${PRODUCTION_URL}/login/">o Prospex</a>...</p></body></html>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/marketing/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
